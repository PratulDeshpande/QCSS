# CZ calibration, weekly: flux chevron through the 11-20 resonance, then the virtual-Z phases.
platform: qcss_qblox_5q
targets: [[0, 1], [1, 2], [0, 2], [1, 3], [2, 4], [3, 4]]
actions:
  - id: chevron
    operation: chevron
    parameters: {amplitude_min: 0.30, amplitude_max: 0.40, amplitude_step: 0.0025, duration_min: 20,
                 duration_max: 160, duration_step: 4, nshots: 200, relaxation_time: 300000}
  - id: cz_phases
    operation: correct_virtual_z_phases
    parameters: {theta_start: 0.0, theta_end: 6.283, theta_step: 0.2, nshots: 1000, relaxation_time: 300000}
