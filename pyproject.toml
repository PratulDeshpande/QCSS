[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qcss"
version = "0.1.0"
description = "Quantum Control Stack Simulator: a hardware-faithful emulator for testing a Quantum OS"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pratul Deshpande" }]
maintainers = [{ name = "Pratul Deshpande" }]
keywords = ["quantum", "quantum-control", "simulator", "pulse-level", "transmon", "qblox", "grpc", "hardware-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.3,<3",
  "scipy>=1.16",
  "qutip>=5.2,<6",
  "stim>=1.15",
  "pymatching>=2.3",
  "grpcio>=1.71.2",
  "grpcio-status>=1.71.2",
  "grpcio-health-checking>=1.71.2",
  "grpcio-reflection>=1.71.2",
  "protobuf>=5.29,<6",              # generated code (grpcio-tools 1.71) and grpcio-status 1.71 both need 5.x
  "pydantic>=2.10,<3",
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
adapters = ["qcodes>=0.61", "pyvisa>=1.16", "pyvisa-sim>=0.7"]
# The virtual lab: QCSS platforms load through Qibolab and are calibrated by Qibocal. Qibolab is pinned
# exactly because its Controller base class lives in the private qibolab._core package.
qibolab  = ["qibolab==0.2.17", "qibo>=0.3,<0.4"]
qibocal  = ["qibocal==0.2.6", "qibolab==0.2.17", "qibo>=0.3,<0.4"]
# The native QICK face: a QickSoc stand-in served over Pyro4. The face never imports qick itself. The qick
# client (what users run, and what the face's tests drive) is a manual install like qibosoq, pinned to
# 0.2.370, the version qibosoq 0.1.5 pins and the firmware description is written for. qick's pynq
# dependency, for the board's ARM CPU, has a git-only requirement that uv's universal lock cannot resolve.
qick     = ["Pyro4>=4.82,<5", "psutil>=5.9"]


[dependency-groups]
# The virtual lab's environment: what a lab server has installed so Qibolab and Qibocal can load QCSS platforms.
lab = ["qcss-qibolab"]
dev = [
  "grpcio-tools>=1.71.2,<1.72",     # keep in step with the protobuf runtime pin; regenerate with scripts/gen_proto.py
  "pytest>=8",
  "anyio>=4",
  "hypothesis>=6",
  "pytest-xdist>=3",
  "cryptography>=42",               # TLS tests and scripts/make_dev_cert.py; without it pyright fails and TLS tests skip
  "ruff>=0.6",
  "pyright==1.1.414",               # pinned: CI type-checks with zero errors; bump deliberately
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/PratulDeshpande/qcss"
Documentation = "https://pratuldeshpande.github.io/QCSS/"
Repository = "https://github.com/PratulDeshpande/qcss"
Issues = "https://github.com/PratulDeshpande/qcss/issues"
Changelog = "https://github.com/PratulDeshpande/qcss/blob/main/CHANGELOG.md"

[project.scripts]
qcss = "qcss.cli:app"

[tool.uv.sources]
qcss-qibolab = { path = "integrations/qcss_qibolab", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/qcss"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/proto", "/scripts", "/buf.yaml", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "integrations/quark_qcss/tests", "integrations/qcss_qibolab/tests", "integrations/qcss_dashboard/tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["src", ".", "integrations/quark_qcss/src", "integrations/qcss_qibolab/src", "integrations/qcss_dashboard/src"]
markers = [
  "slow: long-running physics oracles (nightly)",
  "stochastic: statistical assertions; run with many seeds nightly",
  "linux_only: requires Linux (JAX, PREEMPT_RT)",
  "virtual_lab: end to end through Qibolab against a chassis (the path Quark takes)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["src/qcss/**/*_pb2*.py", "src/qcss/**/*_pb2*.pyi"]

[tool.ruff.lint.isort]
known-first-party = ["qcss", "quark_qcss", "qcss_qibolab", "qcss_dashboard", "tests"]

[tool.pyright]
include = ["src", "tests", "scripts", "integrations/quark_qcss", "integrations/qcss_qibolab", "integrations/qcss_dashboard/src", "integrations/qcss_dashboard/tests", "platforms"]
extraPaths = ["src", ".", "integrations/quark_qcss/src", "integrations/qcss_qibolab/src", "integrations/qcss_dashboard/src"]
exclude = ["src/qcss/**/*_pb2*.py"]
pythonVersion = "3.12"
