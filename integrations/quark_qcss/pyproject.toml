[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quark-qcss"
version = "0.1.0"
description = "Quark-QOS HAL (DeviceProvider) and ExecutionDriver for QCSS-compatible superconducting control stacks"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Pratul Deshpande" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "qcss",                         # the generated qcss.v1 stubs and qcss.client
  "pydantic>=2.10,<3",
  "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quark_qcss"]
