# Quark device profile for the QCSS transmon_5q simulator on the qblox_cluster_5q profile.
#
# The device profile holds the static facts (HLD §5.6, ADR-0054); QcssDeviceProvider.describe() adds the
# dynamic ones from the control stack (DescribeDevice). The profile is the single source of native gates:
# the Compilation Pipeline translates to exactly these, and the lab's pulse_library.yaml runs them.

device_id: qcss-transmon-5q
modality: superconducting
maturity_level: L4               # describe, calibration feed, submit/result, status/cancel/health
program_types: [gate]
sites: [0, 1, 2, 3, 4]
coupling: [[0, 1], [0, 2], [1, 2], [1, 3], [2, 4], [3, 4]]   # transmon_5q couplers

native_ops:
  - name: x
    arity: 1
    definition: "X (pi rotation about x)"
    clifford: true
    duration_s: 2.0e-8
  - name: sx
    arity: 1
    definition: "sqrt(X) (pi/2 rotation about x)"
    clifford: true
    duration_s: 2.0e-8
  - name: rz
    arity: 1
    params: [{name: theta, unit: rad}]
    definition: "Rz(theta) as a virtual frame shift of -theta (OpenPulse convention); zero duration"
    clifford: "theta multiple of pi/2"
    duration_s: 0.0
  - name: measure
    arity: 1
    definition: "Z-basis discriminated readout"
    clifford: false
    duration_s: 1.0e-6
  # cz is not listed: transmon_5q has no calibrated CZ flux pulse yet. Add it here and in
  # pulse_library.yaml (two_qubit) together once the lab calibrates one.

capabilities:
  max_shots: 1000000
  mid_circuit_measurement: false  # measurement in the middle works, but no feed-forward in the translator
  submission_level: native-circuit
  server_transformations: []      # QCSS runs the pulses it is given (executed_as_submitted = true)
  accepts_timed_circuits: false

requires_approval: false
