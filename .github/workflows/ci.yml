name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff check src tests scripts integrations

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      # The virtual lab (Qibolab driver, platforms, technician, acceptance harness) imports qibolab and qibocal:
      # type-check against the lab stack, not the bare core.
      - run: python -m pip install -e ".[qibocal,qick]" -e integrations/qcss_qibolab --group dev
      - run: python -m pip install "qick==0.2.370"   # the native QICK face's client (the version qibosoq 0.1.5 pins)
      - run: pyright

  proto:
    name: Generated protobuf code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: python scripts/gen_proto.py
      - name: Fail if regeneration changed the committed code
        run: git diff --exit-code -- src/qcss/v1

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[qick]" --group dev
      - run: python -m pip install "qick==0.2.370"   # the native QICK face's client (the version qibosoq 0.1.5 pins)
      # A test stuck for 10 minutes dumps every thread's stack into the log: Windows jobs have hung with no output.
      - run: python -m pytest -o faulthandler_timeout=600

  virtual-lab:
    # The core test job has no Qibolab/Qibocal, so it skips the virtual lab. This job installs the lab stack the way a
    # lab server would (the qibosoq client is a git pin: its PyPI release forces numpy 1.26) and runs the full suite.
    name: Virtual lab (Qibolab + Qibocal, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[qibocal,qick]" -e integrations/qcss_qibolab --group dev
      - run: python -m pip install "qick==0.2.370"   # the native QICK face's client (the version qibosoq 0.1.5 pins)
      - run: python -m pip install "qibosoq @ git+https://github.com/qiboteam/qibosoq@2c376278785e6ae8aae1f13d1b0b467e067aaf7d"
      - run: python -m pytest -n auto -rs

  dashboard-web:
    # The QCSS Explorer frontend; its bridge (integrations/qcss_dashboard) is tested by the Python jobs above.
    name: Dashboard frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/qcss_dashboard/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/qcss_dashboard/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
