version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # protobuf and grpcio-tools are pinned together on purpose (see pyproject.toml).
    ignore:
      - dependency-name: protobuf
      - dependency-name: grpcio-tools
  # The QCSS Explorer frontend (integrations/qcss_dashboard/web).
  - package-ecosystem: npm
    directory: /integrations/qcss_dashboard/web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
